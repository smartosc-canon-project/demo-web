<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopLite</title>
  </head>
  <body>
    <header>
      <h1>ShopLite</h1>
      <p id="message" role="status"></p>
    </header>
    <main>
      <section>
        <h2>Products</h2>
        <div id="products"></div>
      </section>
      <section>
        <h2>Cart</h2>
        <div id="cart"></div>
        <form id="checkout">
          <label>Email <input id="email" type="email" required placeholder="you@example.com" /></label>
          <label>Discount code <input id="discount" type="text" placeholder="SAVE10" /></label>
          <button type="submit">Place order</button>
        </form>
      </section>
      <section>
        <h2>My orders</h2>
        <button id="refresh-orders" type="button">Refresh</button>
        <div id="orders"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
